<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生物と環境 一問一答</title>
<style>
:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1d2b22; --sub:#5d6b62; --line:#dde3d8;
  --accent:#2f7a4d; --accent-ink:#ffffff; --accent-soft:#e3f1e8;
  --ok:#1f8a4c; --ok-soft:#dff3e6; --ng:#c0392b; --ng-soft:#fbe5e1;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 8px 24px rgba(20,40,25,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a15; --card:#1b261f; --ink:#e8f0ea; --sub:#9fb0a5; --line:#2c3a31;
    --accent:#5cc185; --accent-ink:#0d1a12; --accent-soft:#223a2b;
    --ok:#5cc185; --ok-soft:#1d3a28; --ng:#ef7b6d; --ng-soft:#3d2320;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121a15; --card:#1b261f; --ink:#e8f0ea; --sub:#9fb0a5; --line:#2c3a31;
  --accent:#5cc185; --accent-ink:#0d1a12; --accent-soft:#223a2b;
  --ok:#5cc185; --ok-soft:#1d3a28; --ng:#ef7b6d; --ng-soft:#3d2320; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub);letter-spacing:0}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  padding:6px 10px;font-size:13px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.card + .card{margin-top:14px}
h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;
  padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-size:11px;opacity:.75;margin-left:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-family:inherit;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font-weight:600;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ok{background:var(--ok);color:#fff}
.btn.ng{background:var(--ng);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.toggle{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink);margin-top:14px}
.toggle label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.count{font-size:13px;color:var(--sub);margin:14px 0 12px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:14px}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;
  padding:1px 10px;font-size:12px;font-weight:600}
.q{font-size:19px;font-weight:600;margin:6px 0 18px;line-height:1.75}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin:0 2px;text-align:center}
input[type=text]{width:100%;font-size:18px;font-family:inherit;padding:12px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--accent)}
.result{margin-top:16px;border-radius:12px;padding:14px 16px}
.result.ok{background:var(--ok-soft)}
.result.ng{background:var(--ng-soft)}
.verdict{font-weight:700;font-size:15px;margin-bottom:2px}
.ok .verdict{color:var(--ok)} .ng .verdict{color:var(--ng)}
.ans{font-size:20px;font-weight:700}
.note{font-size:14px;color:var(--sub);margin-top:6px}
.yours{font-size:13px;color:var(--sub);margin-top:2px}
.stack{display:grid;gap:10px;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score{font-size:48px;font-weight:800;color:var(--accent);line-height:1.1}
.score small{font-size:18px;color:var(--sub);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.wrong-list{margin:8px 0 0;padding:0;list-style:none}
.wrong-list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.wrong-list b{color:var(--ng)}
.qimg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto 16px;border-radius:10px;border:1px solid var(--line);background:#fff}
.hide{display:none!important}
@media (max-width:420px){.q{font-size:18px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>生物と環境 一問一答<small>第17回〜第21回 授業プリントより</small></h1>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="表示テーマ切り替え">🌓</button>
  </header>

  <!-- 設定 -->
  <section id="setup">
    <div class="card">
      <h2>出題範囲(複数選択できます)</h2>
      <div class="chips" id="chapChips"></div>
      <h2 style="margin-top:18px">モード</h2>
      <div class="chips" id="modeChips">
        <button type="button" class="chip" data-mode="flip" aria-pressed="true">タップで答え表示</button>
        <button type="button" class="chip" data-mode="type" aria-pressed="false">入力して答え合わせ</button>
      </div>
      <div class="toggle">
        <label><input type="checkbox" id="optShuffle" checked> ランダムに出題</label>
        <label><input type="checkbox" id="optWrongOnly"> 前回まちがえた問題だけ <span id="wrongCnt" style="color:var(--sub)"></span></label>
      </div>
      <div class="count" id="poolCount"></div>
      <div class="row">
        <button class="btn" id="startBtn" type="button">スタート</button>
        <button class="btn ghost" id="clearBtn" type="button">苦手記録をリセット</button>
      </div>
    </div>
    <div class="card">
      <h2>使い方</h2>
      <div style="font-size:14px;color:var(--sub)">
        「タップで答え表示」では、問題をタップ(または Enter)で答えが出るので、「わかった / わからなかった」で自己採点して次へ進みます(キーボードは → / ←)。「入力して答え合わせ」では、答えを入力して Enter で判定します。まちがえた問題は記録され、「前回まちがえた問題だけ」で復習できます。
      </div>
    </div>
  </section>

  <!-- 出題 -->
  <section id="quiz" class="hide">
    <div class="progress"><i id="bar"></i></div>
    <div class="meta"><span id="pos"></span><span id="live"></span></div>
    <div class="card" id="card">
      <span class="badge" id="qChap"></span>
      <div class="q" id="qText"></div>
      <img id="qImg" class="qimg hide" alt="問題の図">
      <div id="flipArea">
        <button class="btn block" id="showBtn" type="button">答えを見る</button>
      </div>
      <div id="inputArea">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" aria-label="答え">
        <div class="two" style="margin-top:12px">
          <button class="btn ghost" id="skipBtn" type="button">わからない</button>
          <button class="btn" id="checkBtn" type="button">答え合わせ</button>
        </div>
      </div>
      <div id="resultArea" class="hide" aria-live="polite">
        <div class="result" id="resultBox">
          <div class="verdict" id="verdict"></div>
          <div class="ans" id="ansText"></div>
          <div class="yours" id="yours"></div>
          <div class="note" id="noteText"></div>
          <img id="aImg" class="qimg hide" alt="解答の図" style="margin-top:12px">
        </div>
        <div class="two hide" id="selfJudge" style="margin-top:12px">
          <button class="btn ng" id="selfNg" type="button"><span id="ngLabel">まちがい</span></button>
          <button class="btn ok" id="selfOk" type="button"><span id="okLabel">正解にする</span></button>
        </div>
        <div class="stack hide" id="nextWrap">
          <div class="two" id="flipRow">
            <button class="btn ghost" id="flipBtn" type="button">判定を変更</button>
            <button class="btn" id="nextBtn" type="button">次へ</button>
          </div>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" id="quitBtn" type="button" style="font-size:13px;padding:8px 14px;min-height:36px">やめて結果を見る</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="done" class="hide">
    <div class="card">
      <h2>結果</h2>
      <div class="score"><span id="sCorrect"></span><small> / <span id="sTotal"></span> 問正解(<span id="sPct"></span>%)</small></div>
      <table>
        <thead><tr><th>回</th><th class="r">正解</th><th></th></tr></thead>
        <tbody id="chapTable"></tbody>
      </table>
    </div>
    <div class="card" id="wrongCard">
      <h2>まちがえた問題</h2>
      <ul class="wrong-list" id="wrongList"></ul>
    </div>
    <div class="stack">
      <button class="btn block" id="retryWrongBtn" type="button">まちがえた問題だけもう一度</button>
      <button class="btn ghost block" id="backBtn" type="button">設定にもどる</button>
    </div>
  </section>
</div>

[99,'図のバイオーム分布図で、夏緑樹林はどの記号?(A〜I)','C',[],'夏緑樹林','biome_question','biome_answer'],
[99,'図のバイオーム分布図で、照葉樹林はどの記号?(A〜I)','D',[],'照葉樹林','biome_question','biome_answer'],
[99,'図のバイオーム分布図で、熱帯多雨林(または亜熱帯多雨林)はどの記号?(A〜I)','E',[],'熱帯多雨林','biome_question','biome_answer'],
[99,'図のバイオーム分布図で、硬葉樹林はどの記号?(A〜I)','F',[],'硬葉樹林','biome_question','biome_answer'],
[99,'図のバイオーム分布図で、雨緑樹林はどの記号?(A〜I)','G',[],'雨緑樹林','biome_question','biome_answer'],
[99,'図のバイオーム分布図で、ステップはどの記号?(A〜I)','H',[],'ステップ','biome_question','biome_answer'],
[99,'図のバイオーム分布図で、サバンナはどの記号?(A〜I)','I',[],'サバンナ','biome_question','biome_answer'],
];
const Q = RAW.map((r,i)=>({id:i,c:r[0],q:r[1],a:r[2],alt:r[3],n:r[4],img:r[5],aimg:r[6]}));

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const norm = s => s.normalize('NFKC').toLowerCase().replace(/[\s　・、，,。.\(\)（）「」]/g,'').replace(/[〜~～ー−–—‐]/g,'-').replace(/[％]/g,'%');
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let wrongSet = new Set(store.get('bio_wrong',[]));
let selected = new Set(store.get('bio_sel2',[17,18,19,20,21,99]));
let mode=store.get('bio_mode','flip');
let deck=[], idx=0, results=[], answered=false;

/* ---------- theme ---------- */
(function(){const t=store.get('bio_theme',null);if(t)document.documentElement.dataset.theme=t;})();
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; store.set('bio_theme',nx);
};

/* ---------- setup ---------- */
function show(id){['setup','quiz','done'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function renderChips(){
  const box=$('#chapChips'); box.innerHTML='';
  Object.keys(CH).sort((a,b)=>a-b).forEach(c=>{
    const n=Q.filter(q=>q.c==c).length;
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    b.setAttribute('aria-pressed',selected.has(+c)); b.title=CH[c];
    b.innerHTML=`${SHORT[c]}<span class="n">${n}問</span>`;
    b.onclick=()=>{selected.has(+c)?selected.delete(+c):selected.add(+c);store.set('bio_sel2',[...selected]);renderChips();updateCount()};
    box.appendChild(b);
  });
}
function pool(){
  let p=Q.filter(q=>selected.has(q.c));
  if($('#optWrongOnly').checked) p=p.filter(q=>wrongSet.has(q.id));
  return p;
}
function updateCount(){
  const p=pool();
  $('#poolCount').textContent=`出題数:${p.length}問`+(selected.size?'':'(範囲を選んでください)');
  $('#startBtn').disabled=p.length===0;
  $('#wrongCnt').textContent=`(${Q.filter(q=>wrongSet.has(q.id)).length}問)`;
}
$('#optWrongOnly').onchange=updateCount;
function renderMode(){document.querySelectorAll('#modeChips .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}
document.querySelectorAll('#modeChips .chip').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;store.set('bio_mode',mode);renderMode()});
renderMode();
$('#clearBtn').onclick=()=>{ if(confirm('苦手記録をすべてリセットしますか?')){wrongSet.clear();store.set('bio_wrong',[]);updateCount();} };

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list){
  deck = $('#optShuffle').checked ? shuffle(list) : list.slice();
  idx=0; results=[]; show('quiz'); showQ();
}
$('#startBtn').onclick=()=>start(pool());

/* ---------- quiz ---------- */
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function showQ(){
  const q=deck[idx]; answered=false;
  $('#bar').style.width=(idx/deck.length*100)+'%';
  $('#pos').textContent=`${idx+1} / ${deck.length}`;
  const ok=results.filter(r=>r.ok).length;
  $('#live').textContent=`正解 ${ok}`;
  $('#qChap').textContent=CH[q.c];
  $('#qText').innerHTML=esc(q.q).replace(/（　）/g,'<span class="blank">&nbsp;</span>');
  const flip=mode==='flip';
  $('#aImg').classList.add('hide');
  if(q.img){$('#qImg').src=IMG[q.img];$('#qImg').classList.remove('hide')}else $('#qImg').classList.add('hide');
  $('#ansInput').value=''; $('#ansInput').disabled=false;
  $('#flipArea').classList.toggle('hide',!flip);
  $('#inputArea').classList.toggle('hide',flip);
  $('#resultArea').classList.add('hide');
  $('#okLabel').textContent=flip?'わかった':'正解にする';
  $('#ngLabel').textContent=flip?'わからなかった':'まちがい';
  $('#flipRow').classList.toggle('hide',flip);
  if(!flip) $('#ansInput').focus({preventScroll:true});
}
function judge(typed){
  const q=deck[idx];
  const cands=[q.a,...q.alt].map(norm);
  const t=norm(typed);
  return t.length>0 && cands.includes(t);
}
function showA(q){ if(q.aimg){$('#aImg').src=IMG[q.aimg];$('#aImg').classList.remove('hide')} else $('#aImg').classList.add('hide'); }
function revealFlip(){
  if(answered) return; answered=true;
  const q=deck[idx]; showA(q);
  $('#flipArea').classList.add('hide'); $('#resultArea').classList.remove('hide');
  $('#resultBox').className='result'; $('#resultBox').style.background='var(--accent-soft)';
  $('#verdict').textContent='答え'; $('#verdict').style.color='var(--accent)';
  $('#ansText').textContent=q.a; $('#noteText').textContent=q.n||''; $('#yours').textContent='';
  $('#selfJudge').classList.remove('hide'); $('#nextWrap').classList.add('hide');
}
$('#showBtn').onclick=revealFlip;
$('#card').onclick=e=>{ if(mode==='flip'&&!answered&&e.target.closest('button')==null) revealFlip(); };
function reveal(typed, skipped){
  if(answered) return; answered=true;
  const q=deck[idx]; showA(q);
  $('#inputArea').classList.add('hide'); $('#resultArea').classList.remove('hide');
  $('#ansText').textContent=q.a; $('#noteText').textContent=q.n||'';
  $('#yours').textContent = skipped ? '' : `あなたの答え:${typed}`;
  if(!skipped && judge(typed)){
    setResult(true); $('#selfJudge').classList.add('hide'); $('#nextWrap').classList.remove('hide');
  } else {
    setResult(false,true);
    // 不一致でも内容が合っている可能性があるので自己判定を提示
    if(skipped){ $('#selfJudge').classList.add('hide'); $('#nextWrap').classList.remove('hide'); }
    else { $('#selfJudge').classList.remove('hide'); $('#nextWrap').classList.add('hide'); }
  }
  document.activeElement && document.activeElement.blur();
}
function setResult(ok,pending){
  const box=$('#resultBox'); box.className='result '+(ok?'ok':'ng'); box.style.background=''; $('#verdict').style.color='';
  $('#verdict').textContent = ok ? '○ 正解!' : (pending ? '× 答えが一致しませんでした' : '× 不正解');
  results[idx]={ok,id:deck[idx].id};
  if(ok) wrongSet.delete(deck[idx].id); else wrongSet.add(deck[idx].id);
  store.set('bio_wrong',[...wrongSet]);
  $('#live').textContent=`正解 ${results.filter(r=>r&&r.ok).length}`;
}
$('#checkBtn').onclick=()=>{const v=$('#ansInput').value.trim(); if(!v){$('#ansInput').focus();return;} reveal(v,false)};
$('#skipBtn').onclick=()=>reveal('',true);
$('#selfOk').onclick=()=>{setResult(true); if(mode==='flip'){next();return;}$('#selfJudge').classList.add('hide');$('#nextWrap').classList.remove('hide');$('#nextBtn').focus()};
$('#selfNg').onclick=()=>{setResult(false); if(mode==='flip'){next();return;}$('#selfJudge').classList.add('hide');$('#nextWrap').classList.remove('hide');$('#nextBtn').focus()};
$('#flipBtn').onclick=()=>{
  const cur=results[idx].ok; setResult(!cur);
};
function next(){ if(idx+1>=deck.length) finish(); else {idx++;showQ();} }
$('#nextBtn').onclick=next;
$('#quitBtn').onclick=()=>{ if(results.filter(Boolean).length===0){show('setup');return;} finish(); };
document.addEventListener('keydown',e=>{
  if($('#quiz').classList.contains('hide')||e.isComposing||e.keyCode===229) return;
  if(mode==='flip'){
    if(e.repeat) return;
    if(e.key==='Enter'){ e.preventDefault(); if(!answered) revealFlip(); else $('#selfOk').click(); return; }
    if(e.key===' '){ if(!answered){revealFlip();e.preventDefault();} return; }
    if(answered&&(e.key==='ArrowRight'||e.key==='o')){$('#selfOk').click();e.preventDefault();}
    if(answered&&(e.key==='ArrowLeft'||e.key==='x')){$('#selfNg').click();e.preventDefault();}
    return;
  }
  if(e.key==='Enter'){
    if(!answered){ $('#checkBtn').click(); e.preventDefault(); }
    else if(!$('#nextWrap').classList.contains('hide')){ next(); e.preventDefault(); }
  }
});

/* ---------- result ---------- */
function finish(){
  const done=results.map((r,i)=>r?{...r,c:deck[i].c,q:deck[i]}:null).filter(Boolean);
  const ok=done.filter(r=>r.ok).length, tot=done.length;
  $('#sCorrect').textContent=ok; $('#sTotal').textContent=tot; $('#sPct').textContent=tot?Math.round(ok/tot*100):0;
  const tb=$('#chapTable'); tb.innerHTML='';
  Object.keys(CH).sort((a,b)=>a-b).forEach(c=>{
    const rs=done.filter(r=>r.c==c); if(!rs.length) return;
    const k=rs.filter(r=>r.ok).length, p=Math.round(k/rs.length*100);
    tb.insertAdjacentHTML('beforeend',`<tr><td>${SHORT[c]}</td><td class="r">${k} / ${rs.length}</td><td style="width:42%"><div class="bar"><i style="width:${p}%"></i></div></td></tr>`);
  });
  const wr=done.filter(r=>!r.ok);
  $('#wrongCard').classList.toggle('hide',wr.length===0);
  $('#retryWrongBtn').classList.toggle('hide',wr.length===0);
  $('#wrongList').innerHTML=wr.map(r=>`<li>${esc(r.q.q)}<br><b>${esc(r.q.a)}</b></li>`).join('');
  $('#retryWrongBtn').onclick=()=>start(wr.map(r=>r.q));
  show('done');
}
$('#backBtn').onclick=()=>{show('setup');updateCount()};

renderChips(); updateCount();
</script>
</body>
</html>
